apiVersion: v1
kind: ConfigMap
metadata:
  name: task-queue-config
data:
  API_PORT: "8080"
  RATE_LIMIT_PER_MIN: "100"
  RATE_LIMIT_BURST: "100"
  WORKER_COUNT: "4"
  WORKER_METRICS_PORT: "9103"
  JOB_EXEC_TIMEOUT_SECONDS: "300"
  SHUTDOWN_GRACE_SECONDS: "30"
  STALE_RECLAIM_AFTER_MINUTES: "10"
  STALE_RECLAIM_INTERVAL_SECONDS: "60"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
