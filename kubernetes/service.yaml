apiVersion: v1
kind: Service
metadata:
  name: task-queue-api
spec:
  selector:
    app: task-queue-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: task-queue-worker-metrics
spec:
  selector:
    app: task-queue-worker
  ports:
    - port: 9103
      targetPort: 9103
  type: ClusterIP
